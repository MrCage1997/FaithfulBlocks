name: Import FaithfulBlocks source archive

on:
  push:
    branches:
      - import/1.6.0-rc6
    paths:
      - 'source-import/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-import/chunk-* > /tmp/faithfulblocks-source.b64
          base64 --decode /tmp/faithfulblocks-source.b64 > /tmp/faithfulblocks-source.tar.xz
          mkdir -p /tmp/faithfulblocks-source
          tar -xJf /tmp/faithfulblocks-source.tar.xz -C /tmp/faithfulblocks-source --strip-components=1

      - name: Import source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='LICENSE' \
            /tmp/faithfulblocks-source/ ./
          rm -rf source-import

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FaithfulBlocks Import Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import FaithfulBlocks 1.6.0-rc6 source'
          git push origin HEAD
